<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="t d">
<title id="t">NexusERP</title><desc id="d">Original cover illustration. Four architectural modules assemble around a shared core, representing a modular monolith. IAM, Catalog and Inventory.</desc>
<defs>
<linearGradient id="bg" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#111421"/><stop offset="1" stop-color="#212638"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E1DCF0"/><stop offset="1" stop-color="#8F91B3"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C4B9E0"/><stop offset="1" stop-color="#5E6386"/></linearGradient>
<linearGradient id="side"><stop stop-color="#585F84"/><stop offset="1" stop-color="#343E60"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#AA9DC8" stop-opacity=".17"/><stop offset="1" stop-color="#AA9DC8" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="800" height="500" rx="24"/></clipPath>
<g id="module"><path d="M0 0L76 40V85L0 45Z" fill="url(#side)"/><path d="M76 40L152 0V45L76 85Z" fill="#242E4A"/><path d="M0 0L76-40L152 0L76 40Z" fill="url(#top)"/><path d="M1 0L76 39L151 0" stroke="#E9E3FB" stroke-opacity=".5"/><path d="M7 21L69 53M7 29L69 61M7 37L69 69" stroke="#B7B0CE" stroke-opacity=".16"/><path d="M84 53L145 22" stroke="#B8AFD4" stroke-opacity=".4"/></g>
</defs>
<style>
.a{animation:assemble-a 12s cubic-bezier(.77,0,.175,1) infinite}.b{animation:assemble-b 12s cubic-bezier(.77,0,.175,1) infinite}.c{animation:assemble-c 12s cubic-bezier(.77,0,.175,1) infinite}.core{animation:core 12s cubic-bezier(.77,0,.175,1) infinite}.signal{animation:signal 12s ease infinite}
@keyframes assemble-a{0%,12%,90%,100%{transform:translate(-17px,-13px)}36%,70%{transform:translate(0,0)}}@keyframes assemble-b{0%,12%,90%,100%{transform:translate(17px,-13px)}36%,70%{transform:translate(0,0)}}@keyframes assemble-c{0%,12%,90%,100%{transform:translateY(19px)}36%,70%{transform:translateY(0)}}@keyframes core{0%,12%,90%,100%{transform:translateY(-13px)}36%,70%{transform:translateY(0)}}@keyframes signal{0%,23%,87%,100%{opacity:.15}43%,65%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.signal{opacity:.7}}
</style>
<g clip-path="url(#clip)">
