<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="t d">
<title id="t">NewLife</title><desc id="d">Original cover illustration. A luminous thread branches between several possible futures, representing a Vietnamese life simulation with local saves and offline play.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#171421"/><stop offset="1" stop-color="#302639"/></linearGradient>
<linearGradient id="thread" x1="112" y1="360" x2="705" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#746F94"/><stop offset=".5" stop-color="#D4BDE7"/><stop offset="1" stop-color="#F3C4DC"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4DCED"/><stop offset=".4" stop-color="#B9A3CA"/><stop offset=".73" stop-color="#686385"/><stop offset="1" stop-color="#413E61"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7D3E9"/><stop offset="1" stop-color="#6D607E"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#D7AAD4" stop-opacity=".17"/><stop offset="1" stop-color="#D7AAD4" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="800" height="500" rx="24"/></clipPath>
<mask id="thread-clip"><path d="M101 340C220 340 223 247 332 247S456 355 568 355S672 271 733 271" stroke="white" stroke-width="5"/><path d="M332 247C436 247 441 167 548 167S651 208 728 208" stroke="white" stroke-width="5"/><path d="M548 167C600 167 602 112 679 112" stroke="white" stroke-width="5"/></mask>
<g id="seed"><path d="M0-27C36-27 36 27 0 27C-36 27-36-27 0-27Z" fill="url(#glass)"/><path d="M0-26C34-26 34 26 0 26C-34 26-34-26 0-26Z" stroke="#E8D4F3" stroke-opacity=".5"/><path d="M-12-16C-24 0-12 14-1 17M1-19C20-16 23 5 10 16" stroke="#F6E8F5" stroke-width="1.3" opacity=".5"/></g>
</defs>
<style>
.thread-light{animation:passage 14s linear infinite}.seed{animation:possibility 9s cubic-bezier(.77,0,.175,1) infinite;transform-origin:0 0}.seed-b{animation-delay:-3s}.seed-c{animation-delay:-6s}.reflection{animation:reflection 10s ease infinite}
@keyframes passage{from{transform:translateX(-240px)}to{transform:translateX(820px)}}@keyframes possibility{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(6deg)}}@keyframes reflection{0%,100%{opacity:.2}50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.thread-light{opacity:0}.reflection{opacity:.4}}
</style>
<g clip-path="url(#clip)">
<rect width="800" height="500" fill="url(#bg)"/>
<ellipse cx="528" cy="254" rx="302" ry="220" fill="url(#haze)"/>
<g stroke="url(#thread)" stroke-width="1.8"><path d="M101 340C220 340 223 247 332 247S456 355 568 355S672 271 733 271"/><path d="M332 247C436 247 441 167 548 167S651 208 728 208"/><path d="M548 167C600 167 602 112 679 112"/></g>
<g mask="url(#thread-clip)"><path class="thread-light" d="M0 80H80L235 400H155Z" fill="#F7E7FA" opacity=".8"/></g>
<ellipse cx="332" cy="292" rx="35" ry="9" fill="#0B0D19" opacity=".25"/><ellipse cx="548" cy="209" rx="32" ry="8" fill="#0B0D19" opacity=".22"/><ellipse cx="568" cy="397" rx="32" ry="8" fill="#0B0D19" opacity=".22"/>
<g transform="translate(332 247)"><g class="seed"><use href="#seed"/><path d="M-7 3L-1 9L11-9" stroke="#3D3356" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g transform="translate(548 167)"><g class="seed seed-b"><use href="#seed"/><path d="M-9-1Q-9-13 0-7Q9-13 9-1Q9 4 0 11Q-9 4-9-1Z" fill="#4E3A60"/></g></g>
<g transform="translate(568 355)"><g class="seed seed-c"><use href="#seed"/><path d="M-9-8V9H10M-3 5L3-1L9 3" stroke="#443453" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g fill="#EBD6E8"><circle cx="101" cy="340" r="4"/><circle cx="733" cy="271" r="4"/><circle cx="728" cy="208" r="4"/><circle cx="679" cy="112" r="4"/></g>
<g class="reflection" stroke="url(#rim)" stroke-width=".7"><path d="M86 358C218 358 220 266 331 266M581 373C671 364 685 291 745 291"/><path d="M347 229C440 227 445 148 534 148"/></g>
<g font-family="'Segoe UI',Arial,sans-serif">
<text x="43" y="68" fill="#F4EDF5" font-size="62" font-weight="700" letter-spacing="-3.8">NewLife</text>
<text x="46" y="112" fill="#C3AFC9" font-size="22">Small choices. Different futures.</text>
<text x="46" y="418" fill="#E7D9E9" font-size="24">A life you can play.</text>
<text x="46" y="452" fill="#BBAAC4" font-size="18">Vietnamese / Offline-first / Local saves</text>
</g>
</g><rect x="1" y="1" width="798" height="498" rx="23" stroke="url(#rim)" stroke-opacity=".4"/>
</svg>
