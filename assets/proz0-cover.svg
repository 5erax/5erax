<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" fill="none" role="img" aria-labelledby="title desc">
<title id="title">ProZ0 — current focus, in development</title>
<desc id="desc">An original animated project cover for a browser-first pixel-art survival sandbox. An isometric island floats beneath a mysterious luminous monument. This is cover artwork, not a gameplay screenshot.</desc>
<defs>
<linearGradient id="bg" x2="1280" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#101C2A"/><stop offset=".55" stop-color="#10192A"/><stop offset="1" stop-color="#19243B"/></linearGradient>
