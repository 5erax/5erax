<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none" role="img" aria-labelledby="lab-title lab-desc">
  <title id="lab-title">Lagna — interfaces that feel alive</title>
  <desc id="lab-desc">Three original interface studies: a bold editorial composition with breathing layout guides, a spring-like toggle with a cursor ripple, and a smoothly layered page transition. These are illustrative UI and motion studies, not product screenshots. Animation pauses when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="lab-edge" x1="24" y1="0" x2="1220" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#3D3456"/><stop offset=".5" stop-color="#252837"/><stop offset="1" stop-color="#36304E"/></linearGradient>
    <linearGradient id="lab-ink" x1="366" y1="60" x2="660" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#B5CFFD"/><stop offset=".48" stop-color="#C5ACFF"/><stop offset="1" stop-color="#F2B4D9"/></linearGradient>
    <linearGradient id="lab-paper" x1="58" y1="159" x2="420" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#171929"/><stop offset="1" stop-color="#10121F"/></linearGradient>
    <linearGradient id="lab-toggle" x1="558" y1="226" x2="722" y2="290" gradientUnits="userSpaceOnUse"><stop stop-color="#787CFF"/><stop offset=".55" stop-color="#B99AFF"/><stop offset="1" stop-color="#DFB1E6"/></linearGradient>
    <linearGradient id="lab-knob" x1="572" y1="228" x2="610" y2="284" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D1CFF1"/></linearGradient>
    <linearGradient id="lab-ribbon" x1="279" y1="211" x2="391" y2="314" gradientUnits="userSpaceOnUse"><stop stop-color="#A0E4E8"/><stop offset=".4" stop-color="#AAB2FF"/><stop offset=".7" stop-color="#D8A6F0"/><stop offset="1" stop-color="#F4B8D2"/></linearGradient>
    <linearGradient id="lab-chart" x1="925" y1="230" x2="1142" y2="308" gradientUnits="userSpaceOnUse"><stop stop-color="#A8D9EE"/><stop offset=".5" stop-color="#BEA5F4"/><stop offset="1" stop-color="#EAB3DE"/></linearGradient>
    <linearGradient id="lab-wash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#AD9CEE" stop-opacity=".24"/><stop offset="1" stop-color="#AD9CEE" stop-opacity="0"/></linearGradient>
    <radialGradient id="lab-aura"><stop stop-color="#8D65FF" stop-opacity=".22"/><stop offset="1" stop-color="#8D65FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="lab-shine"><stop stop-color="#EBD8FF" stop-opacity=".2"/><stop offset="1" stop-color="#EBD8FF" stop-opacity="0"/></radialGradient>
    <filter id="lab-shadow" x="-35%" y="-70%" width="170%" height="240%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03040B" flood-opacity=".7"/></filter>
    <filter id="lab-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="lab-frame"><rect x=".5" y=".5" width="1279" height="429" rx="27.5"/></clipPath>
    <clipPath id="lab-study-a"><rect x="44" y="143" width="380" height="218" rx="17"/></clipPath>
    <clipPath id="lab-study-c"><rect x="856" y="143" width="380" height="218" rx="17"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .layout-guides{animation:guides 7s ease-in-out infinite}
    .layout-art{transform-box:fill-box;transform-origin:center;animation:art-breathe 7s cubic-bezier(.4,0,.2,1) infinite}
    .control-fill{animation:toggle-fill 6.6s ease-in-out infinite}
    .control-knob{animation:toggle-spring 6.6s linear infinite}
    .control-ripple{transform-box:fill-box;transform-origin:center;opacity:0;animation:control-ripple 6.6s ease-out infinite}
    .control-cursor{animation:cursor-tap 6.6s cubic-bezier(.4,0,.2,1) infinite}
    .on-word{animation:on-word 6.6s ease-in-out infinite}
    .off-word{animation:off-word 6.6s ease-in-out infinite}
    .page-front{animation:page-front 8s cubic-bezier(.22,.8,.25,1) infinite}
    .page-back{animation:page-back 8s cubic-bezier(.22,.8,.25,1) infinite}
    .page-ink{animation:page-ink 8s ease-in-out infinite}
    .status-light{animation:status-light 3s ease-in-out infinite}
    @keyframes guides{0%,12%,90%,100%{opacity:.08}30%,64%{opacity:.45}}
    @keyframes art-breathe{0%,100%{transform:rotate(-8deg) scale(.97)}50%{transform:rotate(8deg) scale(1.035)}}
    @keyframes toggle-fill{0%,23%,82%,100%{opacity:.12}31%,74%{opacity:1}}
    @keyframes toggle-spring{0%,24%,83%,100%{transform:translateX(0)}29%{transform:translateX(101px)}32%{transform:translateX(92px)}35%,73%{transform:translateX(96px)}78%{transform:translateX(-5px)}81%{transform:translateX(2px)}}
    @keyframes control-ripple{0%,23%,35%,100%{opacity:0;transform:scale(.6)}24%{opacity:.7;transform:scale(.6)}34%{opacity:0;transform:scale(2.4)}}
    @keyframes cursor-tap{0%,12%,89%,100%{transform:translate(47px,32px);opacity:0}20%,25%{transform:translate(0,0);opacity:1}28%{transform:translate(0,2px);opacity:1}37%,71%{transform:translate(20px,19px);opacity:0}76%{transform:translate(0,0);opacity:.9}79%{transform:translate(0,2px);opacity:.9}85%{transform:translate(25px,24px);opacity:0}}
    @keyframes on-word{0%,26%,79%,100%{opacity:0}34%,71%{opacity:1}}
    @keyframes off-word{0%,22%,86%,100%{opacity:1}31%,76%{opacity:0}}
    @keyframes page-front{0%,12%,100%{transform:translate(0,0)}33%,66%{transform:translate(-12px,-9px)}84%{transform:translate(0,0)}}
    @keyframes page-back{0%,12%,100%{transform:translate(0,0);opacity:.6}33%,66%{transform:translate(12px,6px);opacity:1}84%{transform:translate(0,0);opacity:.6}}
    @keyframes page-ink{0%,12%,100%{opacity:.55;transform:translateY(4px)}34%,67%{opacity:1;transform:translateY(0)}85%{opacity:.55;transform:translateY(4px)}}
    @keyframes status-light{0%,100%{opacity:.55}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.layout-guides,.layout-art,.control-fill,.control-knob,.control-ripple,.control-cursor,.on-word,.off-word,.page-front,.page-back,.page-ink,.status-light{animation:none!important}.layout-guides{opacity:.2}.control-fill{opacity:1}.control-knob{transform:translateX(96px)}.on-word{opacity:1}.off-word,.control-ripple,.control-cursor{opacity:0}.page-front{transform:translate(-8px,-6px)}.page-back{transform:translate(8px,4px)}}
  </style>

  <g clip-path="url(#lab-frame)">
    <rect width="1280" height="430" rx="28" fill="#0B0D19"/>
    <ellipse cx="1105" cy="67" rx="238" ry="132" fill="url(#lab-aura)" opacity=".42"/>
    <text x="44" y="42" fill="#A99CBD" font-size="11" letter-spacing="2.1" class="mono">UI / INTERACTION / MOTION</text>
    <text x="42" y="97" fill="#EEEFF8" font-size="39" font-weight="600" letter-spacing="-1.6">Interfaces that <tspan fill="url(#lab-ink)">feel alive.</tspan></text>
    <circle class="status-light" cx="1055" cy="41" r="3" fill="#D0B8F9"/>
    <text x="1067" y="45" fill="#C4B8D7" font-size="10" letter-spacing="1.3" class="mono">THE INTERFACE LAB</text>
    <text x="1236" y="90" text-anchor="end" fill="#8D8CA3" font-size="12">Small details. Strong impact.</text>

    <!-- Study 01: editorial layout and visible spatial rhythm. -->
    <g clip-path="url(#lab-study-a)">
      <rect x="44" y="143" width="380" height="218" rx="17" fill="url(#lab-paper)"/>
      <g class="layout-guides" stroke="#B7A5E4" stroke-width=".8" stroke-dasharray="3 5">
        <path d="M68 144V361M150 144V361M234 144V361M317 144V361M400 144V361M44 193H424M44 311H424"/>
      </g>
      <path d="M68 180H400" stroke="#464053" stroke-opacity=".65"/>
      <text x="68" y="167" fill="#DDD6EC" font-size="9" font-weight="600" letter-spacing="1.9" class="mono">FORM / 001</text>
      <path d="M384 163H398M384 168H393" stroke="#9788AD" stroke-width="1.3" stroke-linecap="round"/>
      <text x="68" y="211" fill="#AAA0BF" font-size="9" letter-spacing="1.2" class="mono">LESS NOISE. MORE INTENT.</text>
      <text x="66" y="248" fill="#F0EDF9" font-size="27" font-weight="600" letter-spacing="-1.15">Make room</text>
      <text x="66" y="277" fill="#D4BDED" font-size="27" font-weight="600" letter-spacing="-1.15">for bold ideas.</text>
      <text x="68" y="300" fill="#8C889F" font-size="10">Space is part of the design.</text>
      <g class="layout-art">
        <ellipse cx="350" cy="255" rx="50" ry="61" fill="url(#lab-aura)"/>
        <path d="M349 214C325 203 302 222 310 244C318 267 364 237 380 264C394 288 359 311 339 293C319 275 371 247 366 225C362 205 335 210 330 230C323 256 376 269 361 291" stroke="#846AB0" stroke-width="19" opacity=".17" filter="url(#lab-soft)"/>
        <path d="M349 214C325 203 302 222 310 244C318 267 364 237 380 264C394 288 359 311 339 293C319 275 371 247 366 225C362 205 335 210 330 230C323 256 376 269 361 291" stroke="url(#lab-ribbon)" stroke-width="9" stroke-linecap="round"/>
        <path d="M349 211C327 202 305 220 313 241" stroke="#E0DBFF" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
      </g>
      <rect x="68" y="319" width="95" height="24" rx="12" fill="#E5DBF8"/>
      <text x="80" y="335" fill="#312442" font-size="9" font-weight="600">Explore the idea</text>
      <path d="M151 327L155 331L151 335M148 331H155" stroke="#473353" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="389" cy="331" r="10" stroke="#60526F"/>
      <path d="M385 335L393 327M386 327H393V334" stroke="#B7A8CF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="44.5" y="143.5" width="379" height="217" rx="16.5" stroke="#353044"/>

    <!-- Study 02: a spring response, press feedback, and state change. -->
    <rect x="450" y="143" width="380" height="218" rx="17" fill="#111320"/>
    <rect x="450.5" y="143.5" width="379" height="217" rx="16.5" stroke="#353044"/>
    <text x="474" y="170" fill="#A19AAD" font-size="9" letter-spacing="1.6" class="mono">DETAIL / 002</text>
    <circle cx="799" cy="166" r="3" fill="#BBA2EF" opacity=".7"/>
    <ellipse cx="640" cy="257" rx="138" ry="89" fill="url(#lab-aura)" opacity=".85"/>
    <path d="M488 257H530M750 257H792" stroke="#39344C" stroke-dasharray="2 5"/>
    <rect x="554" y="218" width="172" height="78" rx="39" stroke="#8C79AA" stroke-opacity=".16"/>
    <rect x="558" y="225" width="164" height="64" rx="32" fill="#282638" stroke="#675A7B" stroke-opacity=".48" filter="url(#lab-shadow)"/>
    <rect class="control-fill" x="558" y="225" width="164" height="64" rx="32" fill="url(#lab-toggle)"/>
    <rect x="559" y="226" width="162" height="62" rx="31" stroke="#EAE1FF" stroke-opacity=".18"/>
    <path d="M591 252V262M586 257H596" stroke="#F6F2FF" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
    <circle cx="689" cy="257" r="5" stroke="#FFF" stroke-opacity=".38" stroke-width="1.3"/>
    <g class="control-knob">
      <circle cx="592" cy="260" r="26" fill="#261C40" opacity=".24"/>
      <circle cx="592" cy="256" r="26" fill="url(#lab-knob)"/>
      <circle cx="592" cy="256" r="25.5" stroke="#FFFFFF" stroke-opacity=".7"/>
      <path d="M588 252V260M592 252V260M596 252V260" stroke="#9B94B3" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    </g>
    <circle class="control-ripple" cx="689" cy="256" r="20" stroke="#F3DFFF" stroke-width="1.2"/>
    <g class="control-cursor">
      <path d="M691 259L692 283L698 277L704 287L709 284L703 274L711 273Z" fill="#F5F1FD" stroke="#252038" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <g font-size="10" letter-spacing="2.3" text-anchor="middle" class="mono">
      <text class="off-word" x="640" y="319" fill="#A7A0B8">A MOMENT OF CALM</text>
      <text class="on-word" x="640" y="319" fill="#DAC8F8">A LITTLE MORE ALIVE</text>
    </g>
    <text x="640" y="340" text-anchor="middle" fill="#7E7B92" font-size="10">Timing. Weight. Feedback.</text>

    <!-- Study 03: depth and staggered movement, with a readable resting frame. -->
    <g clip-path="url(#lab-study-c)">
      <rect x="856" y="143" width="380" height="218" rx="17" fill="#111320"/>
      <text x="880" y="170" fill="#A19AAD" font-size="9" letter-spacing="1.6" class="mono">FLOW / 003</text>
      <ellipse cx="1048" cy="275" rx="166" ry="114" fill="url(#lab-aura)" opacity=".55"/>
      <path d="M883 316H1209M883 272H1209M883 227H1209" stroke="#252535" stroke-dasharray="2 7"/>
      <g class="page-back">
        <rect x="953" y="214" width="228" height="127" rx="12" fill="#232237" stroke="#6A567D" stroke-opacity=".55"/>
        <rect x="969" y="231" width="75" height="5" rx="2.5" fill="#766385"/>
        <rect x="969" y="244" width="48" height="3" rx="1.5" fill="#51445F"/>
        <path d="M1130 321H1159" stroke="#B2A0CD" stroke-width="3" stroke-linecap="round" opacity=".4"/>
      </g>
      <g class="page-front" filter="url(#lab-shadow)">
        <rect x="913" y="197" width="238" height="131" rx="12" fill="#191A2B"/>
        <rect x="913.5" y="197.5" width="237" height="130" rx="11.5" stroke="#8D78AC" stroke-opacity=".6"/>
        <path d="M928 225H1135" stroke="#393348"/>
        <text x="930" y="215" fill="#D7C9E9" font-size="8" font-weight="600" letter-spacing="1.3" class="mono">IN GOOD FLOW</text>
        <circle cx="1128" cy="210" r="2" fill="#B9D9E8"/>
        <g class="page-ink">
          <text x="930" y="246" fill="#EEEAF7" font-size="12" font-weight="600" letter-spacing="-.2">Find your rhythm.</text>
          <text x="930" y="260" fill="#9290A8" font-size="8">Continuity makes the difference.</text>
          <path d="M932 300C954 300 961 280 981 280S1009 309 1030 289S1058 279 1080 274S1104 287 1134 270V314H932Z" fill="url(#lab-wash)"/>
          <path d="M932 300C954 300 961 280 981 280S1009 309 1030 289S1058 279 1080 274S1104 287 1134 270" stroke="url(#lab-chart)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="1080" cy="274" r="3" fill="#D2B7EF"/>
          <circle cx="1080" cy="274" r="6" stroke="#D2B7EF" stroke-opacity=".22"/>
        </g>
      </g>
      <rect x="1168" y="190" width="43" height="19" rx="9.5" fill="#27243B" stroke="#5B496E" stroke-opacity=".55"/>
      <text x="1189.5" y="203" text-anchor="middle" fill="#C4B4DD" font-size="8" letter-spacing=".5" class="mono">ease</text>
    </g>
    <rect x="856.5" y="143.5" width="379" height="217" rx="16.5" stroke="#353044"/>

    <!-- Captions remain outside the moving studies. -->
    <text x="44" y="396" fill="#F0EBF7" font-size="14" font-weight="500">Visual hierarchy</text>
    <text x="424" y="396" text-anchor="end" fill="#776B90" font-size="10" class="mono">01</text>
    <text x="450" y="396" fill="#F0EBF7" font-size="14" font-weight="500">Micro-interactions</text>
    <text x="830" y="396" text-anchor="end" fill="#776B90" font-size="10" class="mono">02</text>
    <text x="856" y="396" fill="#F0EBF7" font-size="14" font-weight="500">Motion systems</text>
    <text x="1236" y="396" text-anchor="end" fill="#776B90" font-size="10" class="mono">03</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="429" rx="27.5" stroke="url(#lab-edge)"/>
</svg>
