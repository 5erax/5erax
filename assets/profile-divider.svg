<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="72" viewBox="0 0 1280 72" role="img" aria-labelledby="divider-title divider-description">
  <title id="divider-title">Lagna — orbital signal</title>
  <desc id="divider-description">A delicate violet and rose signal, framed by curved orbital traces. A soft point of light travels slowly across the transparent divider.</desc>
  <defs>
    <linearGradient id="signal" x1="64" y1="36" x2="1216" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7BFF" stop-opacity="0"/>
      <stop offset=".18" stop-color="#9B7BFF" stop-opacity=".22"/>
      <stop offset=".42" stop-color="#B79BFF" stop-opacity=".74"/>
      <stop offset=".58" stop-color="#F3A1D8" stop-opacity=".74"/>
      <stop offset=".82" stop-color="#EF91CE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#EF91CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="192" y1="36" x2="1088" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B7BFF" stop-opacity="0"/>
      <stop offset=".3" stop-color="#A98CFF" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#D5B9FF" stop-opacity=".04"/>
      <stop offset=".7" stop-color="#E799D0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#E799D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="traveler" x1="64" y1="36" x2="1216" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AF9CFF" stop-opacity="0"/>
      <stop offset=".14" stop-color="#B8A5FF" stop-opacity=".65"/>
      <stop offset=".48" stop-color="#CBEDFF"/>
      <stop offset=".66" stop-color="#F5B9E8" stop-opacity=".9"/>
      <stop offset=".86" stop-color="#EEA0D5" stop-opacity=".65"/>
      <stop offset="1" stop-color="#EEA0D5" stop-opacity="0"/>
    </linearGradient>
    <filter id="signal-glow" filterUnits="userSpaceOnUse" x="0" y="12" width="1280" height="48" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="point-glow" filterUnits="userSpaceOnUse" x="0" y="12" width="1280" height="48" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <style>
      .travel { animation: signal-travel 13s linear infinite; }
      @keyframes signal-travel {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        .travel { stroke-dashoffset: 500; }
      }
    </style>
  </defs>
  <g fill="none">
    <path d="M64 36H1216" stroke="url(#signal)" stroke-width="3" opacity=".28" filter="url(#signal-glow)"/>
    <path d="M64 36H1216" stroke="url(#signal)" stroke-width=".85"/>
    <path d="M192 36H310C398 36 406 19 488 19H579M701 53H792C874 53 882 36 970 36H1088" stroke="url(#orbit)" stroke-width=".7"/>
    <path d="M246 36H326C414 36 422 53 504 53H555M725 19H776C858 19 866 36 954 36H1034" stroke="url(#orbit)" stroke-width=".6" opacity=".6"/>
    <path class="travel" d="M64 36H1216" pathLength="1000" stroke="url(#traveler)" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 997" stroke-dashoffset="1000" opacity=".8" filter="url(#point-glow)"/>
    <path class="travel" d="M64 36H1216" pathLength="1000" stroke="url(#traveler)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 997" stroke-dashoffset="1000"/>
    <ellipse cx="640" cy="36" rx="12" ry="6" stroke="#C2AAEF" stroke-width=".65" opacity=".27"/>
  </g>
  <circle cx="640" cy="36" r="1.5" fill="#E0C9FF" opacity=".82"/>
</svg>
